name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      run_scan:
        description: "Run the OEDRO public question scan before deploying"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout pinned OEDRO scanner
        if: github.event_name == 'schedule' || inputs.run_scan == true
        uses: actions/checkout@v4
        with:
          repository: Aiiioli/oedro-cloud-listening
          ref: 48962ce6bda3a8cf574130ae4160a2280d50125a
          path: .ci/oedro-listening-agent
          token: ${{ secrets.OEDRO_SCANNER_REPO_TOKEN }}
          persist-credentials: false
      - name: Set up Python for cloud scan
        if: github.event_name == 'schedule' || inputs.run_scan == true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .ci/oedro-listening-agent/pyproject.toml
      - name: Run public-safe OEDRO scan
        id: public_scan
        continue-on-error: true
        if: github.event_name == 'schedule' || inputs.run_scan == true
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OEDRO_STATE_HMAC_KEY: ${{ secrets.OEDRO_STATE_HMAC_KEY }}
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -e .ci/oedro-listening-agent
          python scripts/daily_demand_radar.py --scanner-root .ci/oedro-listening-agent
          node scripts/check-demand-radar.js
          python scripts/test_daily_demand_radar.py
          node scripts/test-demand-radar-check.js
      - name: Save scan state and public feed
        if: always() && (github.event_name == 'schedule' || inputs.run_scan == true)
        run: |
          git config user.name "OEDRO Hub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/demand-radar.json .github/demand-radar-state.json
          if git diff --cached --quiet; then
            echo "No scan changes to commit"
          else
            git commit -m "Update OEDRO public question signals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Test public user voice boundary
        run: node scripts/test-public-user-voice-check.js
      - name: Test public demand radar boundary
        run: |
          node scripts/check-demand-radar.js
          node scripts/test-demand-radar-check.js
          python scripts/test_daily_demand_radar.py
      - name: Validate static work records
        run: |
          node scripts/check-content-studio.js
          python3 scripts/test-update-hub-record.py
      - name: Build public artifact
        run: |
          mkdir public-dist
          cp .nojekyll *.html *.js *.css public-dist/
          cp -R assets data preview public-dist/
      - name: Validate complete public artifact
        run: |
          PUBLIC_SITE_ROOT=public-dist node scripts/check-public-user-voice.js
          PUBLIC_SITE_ROOT=public-dist node scripts/check-demand-radar.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark failed scan or validation as failed
        if: steps.public_scan.outcome == 'failure'
        run: exit 1
