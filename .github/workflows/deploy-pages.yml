name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test public user voice boundary
        run: |
          node scripts/test-public-user-voice-check.js
          node scripts/check-content-pipeline-tests.js
          node scripts/test-content-pipeline-records.js
          node scripts/check-public-pages.js
          node scripts/check-anti-slop.js
      - name: Test public demand radar boundary
        run: |
          node scripts/check-demand-radar.js
          node scripts/test-demand-radar-check.js
          python scripts/test_daily_demand_radar.py
      - name: Validate static work records
        run: |
          node scripts/check-content-studio.js
          node scripts/check-content-pipeline-tests.js
          node scripts/check-mascot-page.js
          python3 scripts/test-update-hub-record.py
      - name: Build public artifact
        run: |
          mkdir public-dist
          cp .nojekyll *.html *.js *.css public-dist/
          cp -R assets data preview public-dist/
      - name: Validate complete public artifact
        run: |
          PUBLIC_SITE_ROOT=public-dist node scripts/check-public-user-voice.js
          PUBLIC_SITE_ROOT=public-dist node scripts/check-demand-radar.js
          PUBLIC_SITE_ROOT=public-dist node scripts/check-mascot-page.js
          PUBLIC_SITE_ROOT=public-dist node scripts/check-content-pipeline-tests.js
          PUBLIC_SITE_ROOT=public-dist node scripts/check-public-pages.js
          PUBLIC_SITE_ROOT=public-dist node scripts/check-anti-slop.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
