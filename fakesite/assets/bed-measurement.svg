<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 550" role="img" aria-labelledby="title desc">
  <title id="title">Inside bed length with the tailgate closed</title>
  <desc id="desc">Top view, not to scale. A straight length arrow runs beside one bed wall, from the inner face of the front bulkhead to the inner face of the closed tailgate. Neither wall thickness nor the bumper is part of the measurement.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13c20"/></marker></defs>
  <rect width="360" height="550" fill="#f5f2eb"/>
  <g font-family="Arial, sans-serif" fill="#172b35">
    <rect x="112" y="20" width="136" height="50" rx="6" fill="#d7dfe2" stroke="#172b35" stroke-width="2"/>
    <text x="180" y="52" text-anchor="middle" font-size="22">CAB</text>
    <text x="180" y="100" text-anchor="middle" font-size="21">A · Inside front wall</text>
    <text x="180" y="124" text-anchor="middle" font-size="19">(bulkhead)</text>
    <path d="M82 145H278V390H82Z" fill="#fff" stroke="#172b35" stroke-width="3"/>
    <path d="M96 160H264V374H96Z" fill="none" stroke="#172b35" stroke-width="2"/>
    <path d="M82 229H119V267H82M278 229H241V267H278" fill="#d7dfe2" stroke="#172b35" stroke-width="2"/>
    <path d="M82 374H278V390H82Z" fill="#d7dfe2" stroke="#172b35" stroke-width="2"/>
    <path d="M145 160V374" stroke="#a13c20" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M130 160H163M130 374H163" stroke="#a13c20" stroke-width="3"/>
    <text x="190" y="270" text-anchor="middle" font-size="21" transform="rotate(-90 190 270)">INSIDE LENGTH</text>
    <text x="180" y="423" text-anchor="middle" font-size="21">B · Inside closed tailgate</text>
    <path d="M80 445H280" stroke="#7d8a90" stroke-width="10"/>
    <text x="180" y="480" text-anchor="middle" font-size="20">Exclude tailgate thickness</text>
    <text x="180" y="505" text-anchor="middle" font-size="20">and bumper</text>
    <text x="180" y="534" text-anchor="middle" font-size="18">Top view · not to scale</text>
  </g>
</svg>
