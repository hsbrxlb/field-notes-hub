name: Clear expired research records
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the free service and clear expired records
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          url = 'https://oedro-light-research.onrender.com/api/maintenance/retention'
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(url, timeout=90) as response:
                      body = json.load(response)
                      if response.status == 200 and body.get('status') == 'ok':
                          print('Expired-record cleanup completed.')
                          break
              except Exception:
                  pass
              if attempt == 4:
                  raise SystemExit('Expired-record cleanup did not complete.')
              time.sleep(25)
          PY
