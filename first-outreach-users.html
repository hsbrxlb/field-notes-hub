<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="首批触达用户完整名单">
  <link rel="icon" href="data:,">
  <title>首批触达用户名单｜OEDRO 海外用户运营</title>
  <link rel="stylesheet" href="base.css?v=20260916-type">
  <link rel="stylesheet" href="theme.css?v=20260916-type">
  <link rel="stylesheet" href="brand-plan.css?v=20260916-type">
  <link rel="stylesheet" href="outreach-plan.css?v=20260916-type">
  <link rel="stylesheet" href="first-outreach-users.css?v=20260916-type">
</head>
<body data-page="first-outreach">
  <a class="skip-link" href="#content">跳到正文</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工作台导航">
      <a class="sidebar-head" href="index.html" aria-label="海外用户运营工作台首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-copy"><strong id="site-title">海外用户运营</strong><span id="site-subtitle">OEDRO 工作台</span></span>
      </a>
      <nav class="nav-list" id="nav-list" aria-label="主页面"></nav>
    </aside>
    <div class="mobile-overlay" hidden></div>
    <div class="workspace">
      <header class="topbar">
        <button class="menu-button" type="button" aria-label="打开导航" aria-expanded="false">☰</button>
        <div class="breadcrumb">海外用户运营 / <strong id="breadcrumb-page">首批触达用户</strong></div>
      </header>
      <main class="main-content brand-plan outreach-plan" id="content">

        <article class="plan-document">
          <a class="list-back" href="first-outreach.html">↖ 返回首批触达用户</a>
          <header class="page-heading"><h1>首批触达用户名单</h1><p>近期访问用户与累计订单金额满 1,000 美元的客户；分类可重叠，全部名单已去重。</p></header>
          <div class="list-filters" role="group" aria-label="按客户分类浏览">
            <button type="button" disabled data-segment="all" aria-pressed="true">全部 <span>—</span></button>
            <button type="button" disabled data-segment="high" aria-pressed="false">高消费客户 <span>—</span></button>
            <button type="button" disabled data-segment="buyers" aria-pressed="false">近期买家 <span>—</span></button>
            <button type="button" disabled data-segment="prospects" aria-pressed="false">近期未下单 <span>—</span></button>
            <button type="button" disabled data-segment="excluded" aria-pressed="false">暂不邀请 <span>—</span></button>
          </div>
          <div class="list-toolbar">
            <p id="list-status" role="status">正在加载名单…</p>
            <div class="list-pagination" aria-label="名单翻页">
              <button type="button" id="list-prev" disabled>上一页</button>
              <span id="list-page"></span>
              <button type="button" id="list-next" disabled>下一页</button>
            </div>
          </div>
          <div class="list-scroll" tabindex="0" role="region" aria-label="首批触达用户名单，可横向滚动">
            <table class="outreach-table">
              <caption class="sr-only">首批触达用户明细，金额为历史订单总金额</caption>
              <thead><tr><th scope="col">序号</th><th scope="col">客户编号</th><th scope="col">打码邮箱</th><th scope="col">历史订单数</th><th scope="col">历史订单金额（美元）</th><th scope="col">邮件订阅</th><th scope="col">客户分类</th><th scope="col">邀请顺序</th></tr></thead>
              <tbody id="list-body"></tbody>
            </table>
          </div>
          <noscript><p>请开启浏览器 JavaScript 查看名单。</p></noscript>
        </article>
      </main>
    </div>
  </div>
  <script src="app.js?v=20260915-r7"></script>
  <script src="first-outreach-users.js?v=20260916-segments"></script>
</body>
</html>
