name: Hub delivery diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Measure public resource delivery from GitHub runner
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          targets = {
              'page': 'https://hsbrxlb.github.io/field-notes-hub/mascot.html',
              'first-image': 'https://hsbrxlb.github.io/field-notes-hub/assets/mascot-evolution/bull-v2/BULL-V2-01.webp',
              'background': 'https://hsbrxlb.github.io/field-notes-hub/assets/background.png',
              'cloudflare-250k': 'https://speed.cloudflare.com/__down?bytes=250000'
          }
          failed = False
          for name, url in targets.items():
              result = subprocess.run(['curl', '--silent', '--show-error', '--compressed', '--connect-timeout', '7', '--max-time', '20', '--output', '/dev/null', '--write-out', '%{json}', url], capture_output=True, text=True, timeout=24)
              raw = json.loads(result.stdout or '{}')
              row = {key: raw.get(key) for key in ['http_code','size_download','speed_download','time_namelookup','time_connect','time_appconnect','time_starttransfer','time_total','http_version']}
              row.update(target=name, exit=result.returncode)
              print(json.dumps(row), flush=True)
              failed |= result.returncode != 0 or raw.get('http_code') != 200
          raise SystemExit(failed)
          PYCODE
