name: Check Light Research
on:
  push:
    paths:
      - 'apps/light-research/**'
      - '.github/workflows/light-research.yml'
  pull_request:
    paths:
      - 'apps/light-research/**'
      - '.github/workflows/light-research.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/light-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/light-research/package-lock.json
      - run: npm ci
      - run: npm run build -- --webpack
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
