<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Measure inside the truck bed</title><desc id="desc">A top-down truck-bed diagram shows a length measurement from the inside of the front bulkhead to the inside of the closed tailgate. Bed rails and wheel wells are labeled. The illustration is not to scale. Confirm the product listing's measurement method.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#006a9f"/></marker></defs>
<rect width="960" height="620" fill="#f3f4f2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#161b20">
<text x="42" y="55" font-size="28" font-weight="700">Measure the usable bed length</text>
<text x="42" y="87" font-size="17" fill="#5d6670">Top view · tailgate closed · diagram not to scale</text>
<rect x="288" y="127" width="364" height="350" fill="#d7dcdf" stroke="#161b20" stroke-width="3"/>
<rect x="310" y="149" width="320" height="306" fill="#fff" stroke="#161b20" stroke-width="2"/>
<path d="M310 273h46q18 0 18 18v56q0 18-18 18h-46M630 273h-46q-18 0-18 18v56q0 18 18 18h46" fill="#e6e9e8" stroke="#161b20" stroke-width="2"/>
<path d="M400 161v282M540 161v282" stroke="#d7dcdf" stroke-width="2"/>
<path d="M470 158v288" stroke="#006a9f" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M310 149H243M310 455H243" stroke="#5d6670" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="48" y="180" font-size="19" font-weight="700">Front bulkhead</text><text x="48" y="206" font-size="16" fill="#5d6670">Start at the inside face</text><path d="M220 180h35l55-31" fill="none" stroke="#5d6670" stroke-width="1.5"/>
<text x="48" y="423" font-size="19" font-weight="700">Closed tailgate</text><text x="48" y="449" font-size="16" fill="#5d6670">End at the inside face</text><path d="M226 429h29l55 26" fill="none" stroke="#5d6670" stroke-width="1.5"/>
<text x="700" y="194" font-size="19" font-weight="700">Bed rails</text><text x="700" y="220" font-size="16" fill="#5d6670">Check rail-system fitment</text><path d="M686 194h-20l-25-25" fill="none" stroke="#5d6670" stroke-width="1.5"/>
<text x="700" y="321" font-size="19" font-weight="700">Wheel wells</text><text x="700" y="347" font-size="16" fill="#5d6670">Do not measure diagonally</text><path d="M686 321h-35l-73-3" fill="none" stroke="#5d6670" stroke-width="1.5"/>
<rect x="430" y="253" width="80" height="98" fill="#fff"/>
<text x="470" y="291" font-size="16" text-anchor="middle" fill="#006a9f" font-weight="700">INSIDE</text><text x="470" y="318" font-size="16" text-anchor="middle" fill="#006a9f" font-weight="700">LENGTH</text>
<path d="M42 515h876" stroke="#d7dcdf"/>
<text x="42" y="549" font-size="18" font-weight="700">Record the measurement in inches.</text>
<text x="42" y="580" font-size="16" fill="#5d6670">Then match the exact product listing. Nominal bed-size labels may differ from your measurement.</text>
</g></svg>
